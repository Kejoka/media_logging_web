<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/icon-192x192.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="%sveltekit.assets%/icon-192x192.png" />
		<link rel="shortcut icon" href="%sveltekit.assets%/icon-192x192.png" />
		<link rel="apple-touch-icon" sizes="192x192" href="%sveltekit.assets%/icon-192x192.png" />
		<link rel="manifest" href="/manifest.json" />
		<meta name="theme-color" content="#1d232a" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		%sveltekit.head%
		<script>
			// A worker from an earlier production build can prevent the dev app from
			// loading its JavaScript modules. Remove it before hydration starts.
			if (
				(location.hostname === 'localhost' || location.hostname === '127.0.0.1') &&
				'serviceWorker' in navigator
			) {
				navigator.serviceWorker.getRegistrations().then(async (registrations) => {
					if (registrations.length === 0) return;
					await Promise.all(registrations.map((registration) => registration.unregister()));
					location.reload();
				});
			}
		</script>
	</head>

	<body class="bg-base-300" data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
